<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Price Forecast</title>
  <style>
    :root { color-scheme: light; --ink: #17221d; --muted: #66756d; --paper: #f4f1e9; --accent: #d35d3f; --line: #d8d4c8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 10%, #e4eadb, transparent 36%), var(--paper); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 10vh 0; }
    .eyebrow { color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 18px 0 12px; font-size: clamp(42px, 8vw, 78px); line-height: .96; font-weight: 500; letter-spacing: 0; }
    .intro { max-width: 580px; color: var(--muted); font-size: 19px; }
    form { display: flex; gap: 10px; margin: 36px 0 16px; max-width: 580px; }
    input, button { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; font: 700 16px Arial, sans-serif; }
    input { min-width: 0; flex: 1; color: var(--ink); background: #fffdf8; text-transform: uppercase; }
    button { cursor: pointer; background: var(--ink); color: #fffdf8; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { min-height: 26px; color: var(--muted); font: 14px Arial, sans-serif; }
    .result { display: none; margin-top: 22px; padding: 24px; border-top: 3px solid var(--accent); background: rgba(255,253,248,.7); }
    .result.visible { display: block; animation: rise .35s ease-out; }
    .result h2 { margin: 0 0 4px; font-size: 32px; font-weight: 500; }
    .date { color: var(--muted); font: 13px Arial, sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
    .label { color: var(--muted); font: 12px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 4px; font-size: 28px; }
    .notice { margin-top: 22px; color: var(--muted); font: 12px/1.4 Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { main { padding-top: 56px; } form { flex-direction: column; } .grid { grid-template-columns: 1fr; gap: 14px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Market research console</div>
    <h1>What might the next session bring?</h1>
    <p class="intro">Enter a symbol for fresh feature calculations and next-session and one-week return estimates.</p>
    <form id="form">
      <input id="ticker" name="ticker" value="{{ default_ticker }}" maxlength="10" autocomplete="off" aria-label="Stock symbol">
      <button id="submit" type="submit">Analyze</button>
    </form>
    <div id="status" role="status"></div>
    <section class="result" id="result" aria-live="polite">
      <h2 id="heading"></h2>
      <div class="date" id="date"></div>
        <div class="grid">
        <div><div class="label">Last close</div><div class="value" id="last"></div></div>
        <div><div class="label">Next-session return</div><div class="value" id="return"></div></div>
          <div><div class="label">Next-session close</div><div class="value" id="forecast"></div></div>
        <div><div class="label">Next-session up probability</div><div class="value" id="probability"></div></div>
          <div><div class="label">One-week return</div><div class="value" id="weekly-return"></div></div>
          <div><div class="label">One-week close</div><div class="value" id="weekly-forecast"></div></div>
      </div>
      <p class="notice" id="notice"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#form');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const ticker = document.querySelector('#ticker').value.trim().toUpperCase();
      button.disabled = true;
      status.textContent = 'Training ticker-specific models and retrieving market data...';
      result.classList.remove('visible');
      try {
        const response = await fetch(`/api/predict?ticker=${encodeURIComponent(ticker)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Prediction failed.');
        document.querySelector('#heading').textContent = data.ticker;
        document.querySelector('#date').textContent = `Data through ${data.as_of}`;
        document.querySelector('#last').textContent = data.last_close.toFixed(2);
        document.querySelector('#return').textContent = `${data.predicted_return >= 0 ? '+' : ''}${(data.predicted_return * 100).toFixed(2)}%`;
        document.querySelector('#forecast').textContent = data.predicted_close.toFixed(2);
        document.querySelector('#probability').textContent = data.predicted_probability === undefined ? 'Unavailable' : `${(data.predicted_probability * 100).toFixed(2)}%`;
        document.querySelector('#weekly-return').textContent = data.predicted_weekly_return === null ? 'Unavailable' : `${data.predicted_weekly_return >= 0 ? '+' : ''}${(data.predicted_weekly_return * 100).toFixed(2)}%`;
        document.querySelector('#weekly-forecast').textContent = data.predicted_weekly_close === null ? 'Unavailable' : data.predicted_weekly_close.toFixed(2);
        document.querySelector('#notice').textContent = data.data_notice;
        result.classList.add('visible');
        status.textContent = '';
      } catch (error) { status.textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
